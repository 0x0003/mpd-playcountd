name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe="mpd-playcountd"
          if [ "${{ matrix.goos }}" = "windows" ]; then exe="${exe}.exe"; fi
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -o "dist/${exe}" .
          cd dist
          zip "../mpd-playcountd_${version}_${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${exe}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mpd-playcountd_${{ github.ref_name }}_${{ matrix.goos }}-${{ matrix.goarch }}
          path: "mpd-playcountd_*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mpd-playcountd_*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
